<html>
<body>
<script>
text = "Hello JavaScript";
document.write("Length: " + text.length + "<br>");
document.write("Uppercase: " + text.toUpperCase() + "<br>");
document.write("Lowercase: " + text.toLowerCase() + "<br>");
document.write("Character at 1: " + text.charAt(1) + "<br>");
document.write("Substring: " + text.substring(0, 9) + "<br>");
document.write("Includes Java: " + text.includes("Java") + "<br>");
document.write("Replace: " + text.replace("JavaScript", "World") + "<br>");
</script>
</body>
</html>
