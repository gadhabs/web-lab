<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>
</head>
<body>

    <h2>Online Examination</h2>

    <form id="exam">

        1. HTML stands for?
        <br>
        <input type="radio" name="q1" value="1"> Hyper Text Markup Language
        <br>
        <input type="radio" name="q1" value="0"> High Text Machine Language
        <br><br>

        2. Which language is used for web scripting?
        <br>
        <input type="radio" name="q2" value="0"> C
        <br>
        <input type="radio" name="q2" value="1"> JavaScript
        <br><br>

        3. Which tag is used for a paragraph?
        <br>
        <input type="radio" name="q3" value="1"> P
        <br>
        <input type="radio" name="q3" value="0"> H1
        <br><br>

        <button type="button" onclick="checkResult()">Submit</button>

    </form>

    <h3 id="result"></h3>

    <script>
        function checkResult() {
            let score = 0;

            let answers = document.querySelectorAll(
                'input[type="radio"]:checked'
            );

            answers.forEach(function(answer) {
                score += Number(answer.value);
            });

            document.getElementById("result").innerHTML =
                "Your Score: " + score + "/3";
        }
    </script>

</body>
</html>
